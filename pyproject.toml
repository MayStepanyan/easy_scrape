[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy_scrape"
version = "0.2.0"
description = "A simple Python package for scraping images from Google Image Search"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
]

[project.urls]
Repository = "https://github.com/MayStepanyan/easy_scrape"

[tool.setuptools.packages.find]
where = ["."]
include = ["easy_scrape*"]
